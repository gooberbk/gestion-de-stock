[project]
name = "gestion-stock-backend"
version = "0.1.0"
description = "Backend FastAPI pour application de gestion de stock"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.132.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    "netifaces>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
